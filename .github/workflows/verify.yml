name: verify
on:
  push:
    branches: [ci-verify]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Submodules (eigen via GitHub mirror; GitLab is flaky)
        run: |
          git config --global url."https://github.com/eigen-mirror/eigen".insteadOf "https://gitlab.com/libeigen/eigen"
          git submodule update --init --recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libasound2-dev \
            libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev xvfb ninja-build
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/linux-toolchain.cmake -DBUILD_AAX=OFF -DT3K_BUILD_UI_TESTBED=ON
      - name: Build
        run: cmake --build build --parallel 4 2>&1 | tail -150
        shell: bash
      - name: DSP tests
        run: ctest --test-dir build/test --output-on-failure -R ChainBake
      - name: UI testbed
        run: xvfb-run -a ctest --test-dir build/plugin/ui/testbed --output-on-failure
